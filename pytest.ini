[pytest]
testpaths = tests
# no:cacheprovider evita que pytest intente crear su cache con mkdtemp(0o700),
# que el sandbox de este entorno no puede listar (ver tests/conftest.py).
addopts = -p no:cacheprovider -ra
markers =
    slow: pruebas que usan el dataset real o tardan mas de ~30 s
filterwarnings =
    ignore::DeprecationWarning
